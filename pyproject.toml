[build-system]
requires = ["hatchling >= 1.27", "hatch-vcs >= 0.5"]
build-backend = "hatchling.build"

[project]
name = "fied"
dynamic = ["version"]
description = "The Foundational Industry Energy Dataset (FIED) is a unit-level characterization of energy use in the U.S. industrial sector"
readme = "README.md"
authors = [
  { name = "Colin McMillan" },
  { name = "Gui Castelao", email = "gpimenta@nrel.gov" },
]
maintainers = [{ name = "Gui Castelao", email = "gpimenta@nrel.gov" }]
requires-python = ">= 3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "geopandas>=0.12.1",
  "matplotlib>=3.6.2",
  "numpy>=1.23.4",
  "openpyxl>=3.0.10",
  "pandas>=1.2.0",
  "polars>=1.0",
  "plotly>=5.11.0",
  "pyarrow>=9.0.0",
  "pyyaml>=6.0",
  "pyxlsb>=1.0.10",
  "requests>=2.32.5,<3",
  "seaborn>=0.12.1",
  "scikit-learn>=1.1.3",
  "stream-unzip>=0.0.95",
  "pooch>=1.8.2",
  "tqdm>=4.67.1",
  "xlrd>=2.0.1",
]
[project.optional-dependencies]
doc = [
  "myst-parser>=3.0.1,<4",
  "sphinx>=7.3.7",
  "sphinx-press-theme>=0.9.1,<0.10",
  "sphinxcontrib-bibtex>=2.6.5,<3",
]

[project.urls]
homepage = "https://github.com/NatLabRockies/foundational-industry-energy-data"
documentation = "https://natlabrockies.github.io/foundational-industry-energy-data/"
repository = "https://github.com/NatLabRockies/foundational-industry-energy-data"

[project.scripts]
fied = "fied.cli:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
fied = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.build.tasks]
build-wheels = { cmd = "uv build --sdist --wheel --out-dir dist/ ." }
publish-pypi = { cmd = "uv publish", depends-on = ["build-wheels"] }

[tool.pixi.feature.dev.tasks]
lint = "ruff check ./src/fied"
format = "ruff format ./src/fied"
tests = "pytest --durations=20 -rapP -vv --cov=fied --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=80 tests/"

[tool.pixi.feature.doc.tasks]
# build-doc = { cmd = "make clean html", cwd = "docs", env = { SPHINXOPTS = "--fail-on-warning --keep-going" } }
build-doc = { cmd = "make clean html", cwd = "docs", env = { SPHINXOPTS = "--keep-going" } }
build-pdf = { cmd = "make latexpdf", cwd = "docs" }
codespell = "codespell"

[tool.pixi.dependencies]
python = "~=3.9.0"
dask = ">=2023.2.0,<2024"
geopandas = "==0.12.1"
matplotlib = "==3.6.2"
numpy = "==1.23.4"
openpyxl = "==3.0.10"
pandas = "==1.2.0"
plotly = "==5.11.0"
pyarrow = "==9.0.0"
pyyaml = "==6.0"
pyxlsb = "==1.0.10"
requests = ">=2.32.5,<3"
seaborn = "==0.12.1"
scikit-learn = "==1.1.3"
polars = ">=1.33.1,<2"
pooch = ">=1.8.2,<2"
tqdm = ">=4.67.1,<5"
cryptography = "==36.0.2"
xlrd = ">=2.0.1,<3"
stream-unzip = ">=0.0.95,<0.0.100"
click = ">=8.1.8,<9"
# Remove importlib_resources dependency when Python 3.10 is the minimum
# supported version, and use instead: from importlib.resources import files
importlib_resources = ">=6.5.2,<7"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["build", "dev", "doc", "test"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.feature.build.dependencies]
python-build = ">=1.3.0,<2"
pkginfo = ">=1.12.1.2,<2"
uv = ">=0.12.0,<0.13"

[tool.pixi.feature.dev.dependencies]
ipython = "==8.15"
ruff = ">=0.9.6,<0.10"

[tool.pixi.feature.doc.dependencies]
make = ">=4.4.1,<5"
sphinx = ">=7.4.7,<8"
myst-parser = ">=3.0.1,<4"
sphinxcontrib-bibtex = ">=2.6.5,<3"
codespell = ">=2.3,<3"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.1,<9"
pytest-cov = ">=6.2.1,<7"
pytest-xdist = ">=3.8.0,<4"

[tool.ruff]
line-length = 79
extend-exclude = [
  "fied/energy/IEDB/ag_total.py",
  "fied/energy/IEDB/county_energy_nonmfg.py",
  "fied/energy/IEDB/mining_total.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
  # "A", # flake8-builtins
  # "B", # flake8-bugbear
  "ARG", # flake8-unused-arguments
  "BLE", # flake8-blind-except
  # "C4", # flake8-comprehensions
  # "C90", # mccabe
  "COM", # flake8-commas
  # "D", # pydocstyle
  # "E", # pycodestyle
  # "EM", # flake8-errmsg
  # "F", # Pyflakes
  # "FURB", # refurb
  "FLY", #  flynt
  # "G", # flake8-logging-format
  "I", # isort
  # "INP", # flake8-no-pep420
  # "ISC", # flake8-implicit-str-concat
  # "LOG", # flake8-logging
  "N",   # pep8-naming
  "NPY", # numpy-specific
  # "PD", # pandas-vet
  # "PERF", # Perflint
  # "PIE", # flake8-pie
  # "PL", # Pylint
  # "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  # "Q", # flake8-quotes
  # "RET", # flake8-return
  "RSE", # flake8-raise
  # "RUF", # Ruff-specific rules
  # "S", # flake8-bandit
  "SLF", # flake8-self
  # "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports (absolute imports)
  # "TRY", # tryceratops
  "UP", # pyupgrade
  # "W", # Warning
]
ignore = [
  "ARG001", # unused function argument
  "ARG002", # unused method argument
  "COM812", # missing-trailing-comma (incompatible with formatter)
  "I001",   # isort: imports are incorrectly sorted
  "N801",   # class name should use CapWords convention
  "N802",   # function name should be lowercase
  "N803",   # argument name should be lowercase
  "N806",   # variable in function should be lowercase
  "N815",   # mixedCase variable in class scope
  "N816",   # mixedCase variable in global scope
  "N999",   # invalid module name
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]

[tool.codespell]
# Paths / glob patterns to skip. Comma-separated string (codespell CLI format).
# Directory skips need a trailing wildcard so fnmatch matches nested paths.
skip = "./.git,./.pixi,./docs/build,./docs/build/*,./docs/source/_build,./docs/source/_build/*,./*.egg-info,./*.egg-info/*,pixi.lock,*.bib,*.csv,*.svg,*.png,*.jpg,*.jpeg,*.pdf,*.xls,*.xlsx,*.xlsm,*.xlsb,*.zip,*.parquet,*.ipynb_checkpoints"
# Domain terms and identifiers that codespell would otherwise flag.
# Extend as false positives appear; keep entries lowercase.
#   fied     - project name
#   nlr      - National Lab (referenced throughout docs)
#   ore      - mineral ore (SCC mappings)
#   trough   - solar / conveyor trough (SCC mappings)
#   padd     - EIA Petroleum Administration for Defense Districts
#   thierry  - author surname
ignore-words-list = "fied,nlr,ore,trough,padd,thierry"
check-filenames = true
check-hidden = true

[tool.hatch.build.targets.wheel]
packages = ["fied"]
artifacts = [
  "fied/data/GHGRP/EPA_FuelEFs.csv",
  "fied/data/GHGRP/US_FIPS_Codes.csv",
  "fied/data/GHGRP/WoodRes_correction_facilities.csv",
]

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.hatch.version.raw-options]
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "v*[0-9]*",
]

[tool.hatch.build.hooks.vcs]
version-file = "fied/_version.py"
