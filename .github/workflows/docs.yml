name: Python Documentation

on:
  # pull_request:
  # push:
  #   branches:
  #     - main
  # release:
  #   types: [published]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_docs:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          locked: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
          environments: doc

      - name: Build HTML docs
        run: |
          pixi reinstall -e doc fied
          pixi run -e doc build-doc

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/html
          retention-days: 7

  publish_docs:
    name: Publish docs to GitHub Pages
    needs: build_docs
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy to Pages
      id-token: write    # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  build_pdf:
    name: Build PDF
    needs: build_docs
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          locked: true
          cache: true
          cache-write: false
          environments: doc

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex

      - name: Build PDF docs
        run: |
          pixi reinstall -e doc fied
          pixi run -e doc build-pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-pdf
          path: docs/build/latex/*.pdf
          if-no-files-found: error
          retention-days: 7

  publish_pdf:
    name: Publish PDF to release
    needs: build_pdf
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-pdf
          path: pdf

      - name: Attach PDF to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: pdf/**/*.pdf
          token: ${{ secrets.GITHUB_TOKEN }}
